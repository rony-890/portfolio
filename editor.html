<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUBHU Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; background: #ece7dc;
    font-family: system-ui, sans-serif; overflow: hidden;
  }
  #editor-ui {
    position: fixed; top: 16px; right: 16px; z-index: 100;
    background: #121413; color: #ece7dc; padding: 16px;
    border-radius: 8px; font-family: monospace; font-size: 13px;
    box-shadow: 0 4px 24px rgba(18,20,19,.3);
  }
  .control { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  label { min-width: 70px; color: #a8a29e; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  input[type="range"] { flex: 1; accent-color: #2234e0; }
  .value { color: #2234e0; font-weight: 700; min-width: 48px; text-align: right; }
  button { background: #2234e0; color: #ece7dc; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; }
  button:hover { background: #1a2ac8; }
  .hint { color: #a8a29e; font-size: 11px; margin-top: 12px; line-height: 1.5; }

  #stage { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  #subhu-text {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-family: "Oswald", sans-serif; font-weight: 800;
    color: #121413; white-space: nowrap; user-select: none;
    pointer-events: none; white-space: nowrap;
  }
  #subhu-text.dragging { cursor: grabbing; pointer-events: auto; }
</style>
</head>
<body>
<div id="editor-ui">
  <div class="control">
    <label>Size</label>
    <input type="range" id="sizeRange" min="80" max="350" value="200" step="2">
    <span class="value" id="sizeVal">200px</span>
  </div>
  <div class="control">
    <label>X Pos</label>
    <input type="range" id="xRange" min="0" max="100" value="50" step="1">
    <span class="value" id="xVal">50%</span>
  </div>
  <div class="control">
    <label>Y Pos</label>
    <input type="range" id="yRange" min="0" max="100" value="50" step="1">
    <span class="value" id="yVal">50%</span>
  </div>
  <button id="resetBtn">Reset</button>
  <div class="hint">
    Drag text to position · Slider for size · Sliders for position<br>
    Screenshot when ready → send to me
  </div>
</div>

<div id="stage">
  <span id="subhu-text">SUBHU</span>
</div>

<script>
const text = document.getElementById('subhu-text');
const sizeRange = document.getElementById('sizeRange');
const xRange = document.getElementById('xRange');
const yRange = document.getElementById('yRange');
const sizeVal = document.getElementById('sizeVal');
const xVal = document.getElementById('xVal');
const yVal = document.getElementById('yVal');
const resetBtn = document.getElementById('resetBtn');

let isDragging = false;
let dragOffsetX = 0, dragOffsetY = 0;
let currentX = 50, currentY = 50, currentSize = 200;

function applyTransform() {
  text.style.fontSize = currentSize + 'px';
  text.style.left = currentX + '%';
  text.style.top = currentY + '%';
  text.style.transform = 'translate(-50%, -50%)';
}

function updateUI() {
  sizeRange.value = currentSize;
  xRange.value = currentX;
  yRange.value = currentY;
  sizeVal.textContent = currentSize + 'px';
  xVal.textContent = currentX + '%';
  yVal.textContent = currentY + '%';
}

sizeRange.addEventListener('input', (e) => {
  currentSize = parseInt(e.target.value);
  applyTransform();
  updateUI();
});

xRange.addEventListener('input', (e) => {
  currentX = parseInt(e.target.value);
  applyTransform();
  updateUI();
});

yRange.addEventListener('input', (e) => {
  currentY = parseInt(e.target.value);
  applyTransform();
  updateUI();
});

resetBtn.addEventListener('click', () => {
  currentSize = 200; currentX = 50; currentY = 50;
  applyTransform();
  updateUI();
});

// Drag functionality
text.addEventListener('mousedown', (e) => {
  isDragging = true;
  text.classList.add('dragging');
  const rect = text.getBoundingClientRect();
  dragOffsetX = e.clientX - rect.left;
  dragOffsetY = e.clientY - rect.top;
  text.style.pointerEvents = 'auto';
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const stage = document.getElementById('stage');
  const stageRect = stage.getBoundingClientRect();
  const textRect = text.getBoundingClientRect();
  
  // Calculate position relative to stage
  const x = ((e.clientX - stageRect.left - dragOffsetX) / stageRect.width) * 100;
  const y = ((e.clientY - stageRect.top - dragOffsetY) / stageRect.height) * 100;
  
  currentX = Math.max(0, Math.min(100, x));
  currentY = Math.max(0, Math.min(100, y));
  applyTransform();
  updateUI();
});

document.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    text.classList.remove('dragging');
    text.style.pointerEvents = 'none';
  }
});

applyTransform();
updateUI();
</script>
</body>
</html>
